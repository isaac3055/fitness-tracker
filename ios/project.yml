name: FitnessTracker
options:
  bundleIdPrefix: com.isaac3055
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SUPABASE_URL: https://YOUR_PROJECT.supabase.co
    SUPABASE_ANON_KEY: YOUR_PUBLISHABLE_KEY
    WEB_APP_URL: https://YOUR_APP.vercel.app
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  FitnessTracker:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaac3055.fitnesstracker
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: FitnessTracker.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [FitnessTrackerTests]
  FitnessTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: FitnessTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
