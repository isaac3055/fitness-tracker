name: Fitness Tracker CI
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve initial dependency lock if absent
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only; fi
      - name: Capture initial dependency manifest
        run: node -e "console.log('LOCKFILE_DATA='+JSON.stringify(require('./package-lock.json')))"
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build configured synthetic auth fixture
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://fitness-ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
      - name: Authenticated UI integration tests
        run: npm run test:e2e
        env:
          E2E_AUTH: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-validation
          path: |
            package-lock.json
            playwright-report
            test-results
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitness_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap synthetic Supabase auth roles
        run: psql -h localhost -U postgres -d fitness_test -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - name: Apply production migration
        run: psql -h localhost -U postgres -d fitness_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611260001_initial.sql
      - name: Verify tenant isolation, deletion and sync idempotency
        run: psql -h localhost -U postgres -d fitness_test -v ON_ERROR_STOP=1 -f supabase/tests/rls.sql
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cp Config.example.xcconfig Config.xcconfig && xcodegen generate
        working-directory: ios
      - name: Build and unit test iOS app
        working-directory: ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild test -project FitnessTracker.xcodeproj -scheme FitnessTracker -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult

